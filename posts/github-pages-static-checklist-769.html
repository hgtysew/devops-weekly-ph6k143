<p>仓库只需推送最终 HTML/CSS/JS，Pages 选择 <code>main</code> 分支与 <code>/ (root)</code>。</p><p>发布前确认 <code>index.html</code> 在根目录，资源路径使用相对路径，避免子路径站点资源 404。</p><p>自定义域名可在仓库 Settings → Pages 中绑定。</p>
