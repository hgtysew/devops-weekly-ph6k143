    <h1>日志里该留哪些字段</h1>
    <p class="meta"><time datetime="2026-08-10">2026-08-10</time></p>
    <article>
<p>结构化日志建议至少包含时间、级别、服务名、requestId、关键路径。</p><p>业务关键再补 userId、耗时、错误码。字段稳定后检索成本会明显下降。</p><p>不要把密码、Token 明文写入日志。</p>
    </article>
