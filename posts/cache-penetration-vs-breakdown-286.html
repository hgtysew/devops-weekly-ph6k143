    <h1>缓存穿透与击穿的区分处理</h1>
    <p class="meta"><time datetime="2026-08-10">2026-08-10</time></p>
    <article>
<p>穿透是查询不存在的数据打穿到 DB；击穿是热点 key 过期瞬间流量打到 DB。</p><p>穿透可用空值缓存或布隆过滤器；击穿可用互斥重建或逻辑过期。</p><p>先用监控确认是哪一种，再选策略，避免盲目加锁。</p>
